<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src http://localhost:*; img-src file: data:"
		/>
		<title>OCS桌面版 - 初始化</title>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}
			html,
			body {
				background: transparent;
				height: 100vh;
				width: 100vw;
				overflow: hidden;
				font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
					'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif;
			}
			body {
				display: flex;
				align-items: center;
				justify-content: center;
				/* 上下留白：给加深后的阴影留出展示空间，避免卡片贴边被窗口裁剪 */
				padding: 16px 0;
			}

			/* ===== a-result 风格整体布局 ===== */
			.result-wrapper {
				position: relative;
				display: flex;
				flex-direction: column;
				align-items: center;
				width: 420px;
				padding: 28px 20px 16px;
				background-color: #fff;
				border: 1px solid #d9dce1;
				/* 与软件卡片级圆角对齐（8px） */
				border-radius: 8px;
				box-shadow: 0 8px 24px 0 rgba(0, 0, 0, 0.16),
					0 4px 10px -4px rgba(0, 0, 0, 0.2),
					0 12px 40px 8px rgba(0, 0, 0, 0.12);
				overflow: hidden;
				/* 长错误信息（多下载源失败详情）适配：卡片限高 + 内容区滚动，
				   否则错误文本撑破卡片超出窗口边界无法查看（win7 分支实测） */
				max-height: calc(100vh - 32px);
				user-select: none;
				/* 无边框窗口：整卡可拖拽移动，鼠标显示为移动样式（交互元素单独排除） */
				-webkit-app-region: drag;
				cursor: move;
			}
			/* 可交互/可滚动区域排除拖拽并恢复默认光标 */
			.result-wrapper button,
			.result-wrapper a,
			.result-close,
			.result-content,
			.confirm-overlay {
				-webkit-app-region: no-drag;
				cursor: default;
			}

			/* 右上角常驻关闭按钮 */
			.result-close {
				position: absolute;
				top: 12px;
				right: 12px;
				display: inline-flex;
				align-items: center;
				justify-content: center;
				width: 16px;
				height: 16px;
				color: #c9cdd4;
				cursor: pointer;
			}
			.result-close:hover {
				color: #4e5969;
			}
			.result-close svg {
				width: 100%;
				height: 100%;
				display: block;
			}

			/* a-result icon 插槽 */
			.result-icon {
				margin-bottom: 12px;
			}
			.result-icon img {
				width: 48px;
				height: 48px;
				border-radius: 10px;
				object-fit: contain;
				display: block;
			}
			/* a-result title（初始化状态） */
			.result-title {
				font-size: 16px;
				line-height: 1.5;
				font-weight: 500;
				color: #1d2129;
				text-align: center;
				margin-bottom: 16px;
				cursor: inherit;
			}
			/* a-result 内容区（步骤列表）：占据剩余空间，错误详情过长时滚动适配 */
			.result-content {
				width: 100%;
				padding: 24px 0px;
				flex: 1;
				min-height: 0;
				overflow-y: auto;
			}
			.result-content::-webkit-scrollbar {
				width: 6px;
			}
			.result-content::-webkit-scrollbar-thumb {
				background: #e5e6eb;
				border-radius: 3px;
			}

			.log-list {
				list-style: none;
				display: flex;
				flex-direction: column;
				gap: 10px;
			}
			.log-item {
				display: flex;
				align-items: flex-start;
				gap: 8px;
				font-size: 13px;
				line-height: 1.5;
			}
			.log-icon {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				width: 16px;
				height: 16px;
				flex-shrink: 0;
				margin-top: 1px;
			}
			.log-spinner {
				display: inline-block;
				width: 12px;
				height: 12px;
				border: 2px solid #e5e6eb;
				border-top-color: #165dff;
				border-radius: 50%;
				animation: arco-spin 1s linear infinite;
			}
			.log-check {
				color: #00b42a;
			}
			.log-check svg {
				width: 16px;
				height: 16px;
				display: block;
			}
			.log-error {
				color: #f53f3f;
			}
			.log-error svg {
				width: 16px;
				height: 16px;
				display: block;
			}
			.log-text {
				color: #86909c;
				word-break: break-word;
				/* 支持多行错误详情（各下载源失败原因逐行展示） */
				white-space: pre-line;
			}
			.log-item.active .log-text {
				color: #1d2129;
				font-weight: 500;
			}
			.log-item.error .log-text {
				color: #f53f3f;
			}

			/* 底部操作区（仅出错时显示） */
			.result-footer {
				margin-top: 16px;
			}
			.arco-btn {
				height: 32px;
				padding: 0 15px;
				border-radius: 2px;
				font-size: 14px;
				line-height: 1.5715;
				border: 1px solid transparent;
				cursor: pointer;
			}
			.arco-btn-secondary {
				background-color: #f2f3f5;
				border-color: #f2f3f5;
				color: #1d2129;
			}
			.arco-btn-secondary:hover {
				background-color: #e5e6eb;
				border-color: #e5e6eb;
			}
			.arco-btn-danger {
				background-color: #f53f3f;
				border-color: #f53f3f;
				color: #fff;
			}
			.arco-btn-danger:hover {
				background-color: #f76560;
				border-color: #f76560;
			}

			/* ===== 关闭确认弹窗（初始化期间点击关闭时展示） ===== */
			.confirm-overlay {
				/* 覆盖整个窗口（不显示遮罩层），弹窗允许宽高超出初始化卡片范围 */
				position: fixed;
				inset: 0;
				background: transparent;
				display: none;
				align-items: center;
				justify-content: center;
				z-index: 10;
			}
			.confirm-dialog {
				/* 允许宽高超出初始化卡片，仅受窗口边界约束 */
				width: 360px;
				max-width: 92vw;
				background: #fff;
				border: 1px solid #d9dce1;
				/* 与初始化窗口圆角对齐（8px） */
				border-radius: 8px;
				/* 无遮罩层：依赖更深的阴影与卡片区分层级 */
				box-shadow: 0 12px 32px rgba(0, 0, 0, 0.28);
				padding: 20px;
			}
			.confirm-title {
				font-size: 15px;
				font-weight: 500;
				color: #1d2129;
				margin-bottom: 8px;
			}
			.confirm-text {
				font-size: 13px;
				color: #4e5969;
				line-height: 1.7;
				margin-bottom: 16px;
				white-space: pre-line;
			}
			.confirm-actions {
				display: flex;
				gap: 12px;
				justify-content: flex-end;
			}

			@keyframes arco-spin {
				to {
					transform: rotate(360deg);
				}
			}
		</style>
	</head>
	<body>
		<div
			id="card"
			class="result-wrapper"
		>
			<!-- 右上角常驻关闭按钮 -->
			<span
				class="result-close"
				id="close-btn"
				title="关闭"
			>
				<svg
					viewBox="0 0 24 24"
					fill="none"
					stroke="currentColor"
					stroke-width="2"
				>
					<path d="M18 6L6 18M6 6l12 12" />
				</svg>
			</span>

			<!-- a-result：icon 插槽 -->
			<div class="result-icon">
				<img
					src="favicon.png"
					alt="OCS"
				/>
			</div>
			<!-- a-result：title（初始化状态） -->
			<div
				id="title"
				class="result-title"
			>
				OCS桌面版软件初始化中
			</div>

			<!-- a-result：内容区（步骤列表） -->
			<div class="result-content">
				<ul
					id="log-list"
					class="log-list"
				>
					<li
						class="log-item active"
						data-index="0"
					>
						<span class="log-icon">
							<span class="log-spinner"></span>
						</span>
						<span class="log-text">正在准备初始化环境...</span>
					</li>
				</ul>
			</div>

			<!-- 底部关闭按钮仅在初始化出错时显示（正常初始化期间隐藏，仅保留右上角关闭） -->
			<div
				class="result-footer"
				id="footer"
				style="display: none"
			>
				<button
					id="footer-btn"
					type="button"
					class="arco-btn arco-btn-danger"
				>
					关闭软件
				</button>
			</div>

			<!-- 初始化期间点击关闭的确认弹窗（绝对定位于卡片内部，遮罩与卡片同宽高同圆角） -->
			<div
				class="confirm-overlay"
				id="confirm-overlay"
			>
				<div class="confirm-dialog">
					<div class="confirm-title">确认关闭？</div>
					<div
						class="confirm-text"
						id="confirm-text"
					>
						初始化尚未完成：内置浏览器可能尚未下载完毕，其他初始化进程也可能尚未结束。现在关闭后软件将无法正常运行。

确定要立即关闭并退出 OCS桌面版 吗？
					</div>
					<div class="confirm-actions">
						<button
							id="confirm-cancel"
							type="button"
							class="arco-btn arco-btn-secondary"
						>
							继续等待
						</button>
						<button
							id="confirm-ok"
							type="button"
							class="arco-btn arco-btn-danger"
						>
							立即关闭
						</button>
					</div>
				</div>
			</div>
		</div>

		<script>
			(function () {
				// ===================== 通用常量 =====================
				/** 软件名称（各文案统一引用） */
				var APP_NAME = 'OCS桌面版';
				/** 初始化状态对应的标题文案 */
				var TITLE_MAP = {
					idle: APP_NAME + '软件初始化中',
					loading: APP_NAME + '软件初始化中',
					done: '初始化完成',
					restart: '初始化完成，即将重启',
					error: '初始化失败'
				};

				// ===================== DOM 引用 =====================
				var titleEl = document.getElementById('title');
				var confirmTextEl = document.getElementById('confirm-text');
				var listEl = document.getElementById('log-list');
				var footerBtn = document.getElementById('footer-btn');
				var footerEl = document.getElementById('footer');
				var confirmOverlay = document.getElementById('confirm-overlay');

				// 状态经 IPC 与主进程通信（preload 暴露 window.ocsInit，无任何网络能力）。
				// preload 缺失（异常场景）时页面保持静态初始状态。
				var ocsInit = window.ocsInit;

				/** 当前初始化状态（render 时更新），用于决定关闭行为 */
				var currentStatus = 'idle';

				// 静态文案统一由常量注入（HTML 中同名静态文本为 JS 未执行时的兜底）
				confirmTextEl.textContent =
					'初始化尚未完成：内置浏览器可能尚未下载完毕，其他初始化进程也可能尚未结束。' +
					'现在关闭后软件将无法正常运行。\n\n确定要立即关闭并退出 ' +
					APP_NAME +
					' 吗？';

				// 右上角关闭按钮常驻：初始化进行中先弹确认，出错/完成/重启中直接关闭窗口
				function requestClose() {
					if (!ocsInit) return;
					if (currentStatus === 'loading' || currentStatus === 'idle') {
						confirmOverlay.style.display = 'flex';
						return;
					}
					ocsInit.close();
				}
				document.getElementById('close-btn').addEventListener('click', requestClose);

				// 底部「关闭软件」按钮（仅出错时显示）：初始化已中止，直接关闭窗口
				footerBtn.addEventListener('click', requestClose);

				// 确认弹窗：继续等待 → 收起；立即关闭 → 停止初始化并退出软件（不重启）
				document.getElementById('confirm-cancel').addEventListener('click', function () {
					confirmOverlay.style.display = 'none';
				});
				document.getElementById('confirm-ok').addEventListener('click', function () {
					if (ocsInit) ocsInit.forceQuit();
				});

				function iconHtml(state) {
					if (state === 'active') {
						return '<span class="log-spinner"></span>';
					}
					if (state === 'error') {
						return (
							'<svg class="log-error" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">' +
							'<circle cx="12" cy="12" r="9"/>' +
							'<path d="M12 7v6M12 16h.01" stroke-linecap="round"/>' +
							'</svg>'
						);
					}
					return (
						'<svg class="log-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" ' +
						'stroke-linecap="round" stroke-linejoin="round">' +
						'<path d="M20 6L9 17l-5-5"/>' +
						'</svg>'
					);
				}

				function render(data) {
					var status = data.status || 'idle';
					var logs = data.logs || [];
					currentStatus = status;
					titleEl.textContent = TITLE_MAP[status] || TITLE_MAP.loading;
					// 底部关闭按钮仅在出错时显示，正常初始化期间隐藏
					footerEl.style.display = status === 'error' ? '' : 'none';

					// 日志列表为空时显示占位
					if (!logs.length) {
						listEl.innerHTML =
							'<li class="log-item active" data-index="0">' +
							'<span class="log-icon"><span class="log-spinner"></span></span>' +
							'<span class="log-text">正在准备初始化环境...</span>' +
							'</li>';
						return;
					}

					var html = '';
					for (var i = 0; i < logs.length; i++) {
						var e = logs[i];
						html +=
							'<li class="log-item ' + e.state + '" data-index="' + e.index + '">' +
							'<span class="log-icon">' + iconHtml(e.state) + '</span>' +
							'<span class="log-text">' + escapeHtml(e.text) + '</span>' +
							'</li>';
					}
					listEl.innerHTML = html;
					// 滚动到最新一条
					listEl.scrollTop = listEl.scrollHeight;
				}

				function escapeHtml(str) {
					return String(str).replace(/[&<>"']/g, function (c) {
						return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
					});
				}

				if (ocsInit) {
					// 先拉取一次当前状态（覆盖订阅前已产生的进度），再订阅主进程推送
					ocsInit.getStatus().then(function (data) {
						if (data && typeof data === 'object') render(data);
					});
					ocsInit.onStatus(function (data) {
						if (data && typeof data === 'object') render(data);
					});
				}
			})();
		</script>
	</body>
</html>
