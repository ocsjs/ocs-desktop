name: Publish Update

# 补发/重发通道（备用）：正常发版走 build.yml 末尾的 publish-update 内嵌审批 job
# （environment 人工 Approve，零输入）；本工作流用于：
# - 内嵌审批被误 Reject 后的补救；
# - 对历史任意 tag 重传 latest*.yml。
#
# 注意：安装包与 latest*.yml 统一存放在 /app/electron-updater/ 扁平目录，
# 旧版本安装包会被 COS 生命周期规则（ocs- 前缀过期删除）清理——
# 补发旧版本前需确认该版本安装包仍在更新目录中，否则客户端会 404。
#
# 原理：latest.yml 是客户端 electron-updater 发现更新的唯一入口，
# 本工作流把它从指定 tag 的 Release 附件下载并上传到 COS 更新目录。
# 数据源是 GitHub Release 附件，不受 CI artifacts 3 天保留期限制，可随时补发/重发。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的版本 tag（如 v3.2.0）'
        required: true
      publish_release:
        description: '同时将 GitHub Release 从草稿转为正式发布'
        type: boolean
        default: true

env:
  # 腾讯云 COS（非机密；机密仅需 secrets.TENCENT_SECRET_ID / TENCENT_SECRET_KEY）
  COS_BUCKET: ocs-1301696006
  COS_REGION: ap-guangzhou
  COS_ENDPOINT: cos.accelerate.myqcloud.com
  # COS 更新目录（与 packages/common/src/constants.ts 的 OCS_UPDATER.feedUrl 保持同步）
  COS_UPDATER_DIR: /app/electron-updater/
  # coscmd 调优参数（与 build.yml 一致）
  COS_THREAD_NUM: "3"
  COS_PART_SIZE: "4"
  COS_RETRY: "10"
  COS_TIMEOUT: "120"

jobs:
  publish-update:
    runs-on: ubuntu-latest
    steps:
      - name: 下载该 tag Release 附件中的 latest*.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p updater-meta
          cd updater-meta
          # 未 checkout 仓库，gh 无法从 git 上下文推断目标仓库，必须显式 --repo
          gh release download "${{ inputs.tag }}" --pattern 'latest*.yml' --clobber --repo ${{ github.repository }}
          echo "已下载的更新元数据文件："
          ls -la
          # 防御：一个 latest*.yml 都没有说明 tag 不存在或构建未完成，直接失败
          ls latest*.yml >/dev/null

      - name: Check COS secrets availability
        id: check-secrets
        run: |
          if [ -n "$COS_SECRET_ID" ]; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
            echo "::error::TENCENT_SECRET_ID 未配置，无法上传 latest.yml"
            exit 1
          fi
        env:
          COS_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}

      - name: Install Tencent Cloud CLI
        run: pip install coscmd

      - name: Configure Tencent Cloud COS
        run: |
          coscmd config -a ${{ secrets.TENCENT_SECRET_ID }} \
            -s ${{ secrets.TENCENT_SECRET_KEY }} \
            -b "$COS_BUCKET" \
            -e "$COS_ENDPOINT" \
            -m "$COS_THREAD_NUM" -p "$COS_PART_SIZE" \
            --retry "$COS_RETRY" --timeout "$COS_TIMEOUT"

      # 逐文件上传 + 调用级重试（与 build.yml 相同策略：分片断点续传，重试续传不重传）
      - name: 上传 latest*.yml 到 COS 更新目录
        shell: bash
        run: |
          set -e
          shopt -s nullglob
          for file in updater-meta/latest*.yml; do
            [ -f "$file" ] || continue
            for attempt in 1 2 3 4 5; do
              echo "Uploading $file (attempt $attempt/5)"
              if coscmd upload -y "$file" "$COS_UPDATER_DIR"; then
                break
              fi
              if [ "$attempt" = 5 ]; then
                echo "::error::Upload failed after 5 attempts: $file"
                exit 1
              fi
              sleep $((attempt * 15))
            done
          done

      - name: 将 Release 转为正式发布
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ inputs.tag }}" --draft=false --repo ${{ github.repository }}
