name: Build and Upload

on:
  workflow_dispatch:

env:
  # 腾讯云 COS（非机密；机密仅需 secrets.TENCENT_SECRET_ID / TENCENT_SECRET_KEY）
  COS_BUCKET: ocs-1301696006
  COS_REGION: ap-guangzhou
  # 全球加速 endpoint：GitHub runner（美国）→ 国内跨境链路慢且部分 runner 路由不通，
  # 走加速域名经腾讯骨干网回源（需 COS 控制台开启全球加速；coscmd 的 -r 与 -e 二选一）
  COS_ENDPOINT: cos.accelerate.myqcloud.com
  # COS 统一存储目录：安装包、blockmap、latest*.yml、CHANGELOG.md 全部存放于此，
  # 客户端更新源与官网下载共用同一份文件（与 packages/common/src/constants.ts 的
  # OCS_UPDATER.feedUrl 保持同步）。安装包文件名自带版本号不会互相覆盖；
  # 旧版本由 COS 生命周期规则自动清理（控制台配置：前缀 /app/electron-updater/ocs-，
  # N 天后过期删除；latest*.yml 与 CHANGELOG.md 不以 ocs- 开头，不受影响）
  COS_UPDATER_DIR: /app/electron-updater/
  # coscmd 调优：跨境慢链路下 16MB 分片单片 2-4 分钟会被服务端 UserNetworkTooSlow 踢断，
  # 4MB 分片约 30s 完成；低并发保证单流带宽；120s 快速失败避免坏路由空等 10 分钟
  COS_THREAD_NUM: "3"
  COS_PART_SIZE: "4"
  COS_RETRY: "10"
  COS_TIMEOUT: "120"

jobs:
  build:
    strategy:
      matrix:
        include:
          # Windows x64
          - os: windows-latest
            platform: win
            arch: x64

          # macOS x64 (Intel Mac runner 原生构建)
          - os: macos-15-intel
            platform: mac
            arch: x64

          # macOS ARM64
          - os: macos-latest
            platform: mac
            arch: arm64

          # Linux x64
          - os: ubuntu-latest
            platform: linux
            arch: x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.14"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: true

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Set Env
        run: |
          VERSION=$(jq -r .version package.json)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "PLATFORM=${{ matrix.platform }}" >> $GITHUB_ENV
          echo "ARCH=${{ matrix.arch }}" >> $GITHUB_ENV
        shell: bash

      - name: Build
        run: pnpm build
        env:
          USE_HARD_LINKS: false
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.platform }}-${{ matrix.arch }}
          # 产物目录：仓库根 releases/（electron.builder.json directories.output）
          path: |
            releases/*.exe
            releases/*.blockmap
            releases/*.dmg
            releases/*.AppImage
            releases/*.deb
            releases/*.rpm
            releases/latest*.yml
          if-no-files-found: ignore
          retention-days: 3

  upload-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Set Env
        run: |
          VERSION=$(jq -r .version package.json)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}/"
          echo "DOWNLOAD_URL=$DOWNLOAD_URL" >> $GITHUB_ENV
          BUILDTIME=$(TZ=Asia/Shanghai date)
          echo "BUILDTIME=$BUILDTIME" >> $GITHUB_ENV
        shell: bash

      - name: Create Release if not exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          gh release create "$TAG_NAME" --draft --generate-notes || true

      - name: Upload artifacts to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          echo "Uploading artifacts to release: $TAG_NAME"
          for file in artifacts/*; do
            if [ -f "$file" ]; then
              echo "Uploading: $file"
              gh release upload "$TAG_NAME" "$file" --clobber || echo "Failed to upload $file"
            fi
          done

      - name: Append custom release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          EXISTING_BODY=$(gh release view "$TAG_NAME" --json body -q .body 2>/dev/null || echo "")
          DL="${{ env.DOWNLOAD_URL }}"
          VER="${{ env.VERSION }}"
          BT="${{ env.BUILDTIME }}"
          CUSTOM_NOTES="
          ---
          ## 📦 下载地址
          ### Windows (不支持Win7)
          - [64位安装包](${DL}ocs-${VER}-setup-win-x64.exe)
          ### macOS
          - [M系列芯片(ARM64)](${DL}ocs-${VER}-setup-mac-arm64.dmg) | [Intel芯片(x64)](${DL}ocs-${VER}-setup-mac-x64.dmg)
          ### Linux
          - [AppImage](${DL}ocs-${VER}-setup-linux-x64.AppImage) | [Debian/Ubuntu (deb)](${DL}ocs-${VER}-setup-linux-x64.deb)
          ### 🔗 快捷访问
          - [官网](https://docs.ocsjs.com/)
          - [官网软件下载（更快）](https://docs.ocsjs.com/docs/app)
          > Created at ${BT}."
          gh release edit "$TAG_NAME" --notes "${EXISTING_BODY}${CUSTOM_NOTES}"

  upload-cos:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # 腾讯云 COS 上传 — 需要配置 secrets
    # 如果是 fork 仓库没有密钥，此 job 会自动跳过
    continue-on-error: true

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Check COS secrets availability
        id: check-secrets
        run: |
          if [ -n "$COS_SECRET_ID" ]; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
            echo "Skipping COS upload: TENCENT_SECRET_ID not configured"
          fi
        env:
          COS_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}

      - name: Install Tencent Cloud CLI
        if: steps.check-secrets.outputs.available == 'true'
        run: pip install coscmd

      - name: Configure Tencent Cloud COS
        if: steps.check-secrets.outputs.available == 'true'
        run: |
          coscmd config -a ${{ secrets.TENCENT_SECRET_ID }} \
            -s ${{ secrets.TENCENT_SECRET_KEY }} \
            -b "$COS_BUCKET" \
            -e "$COS_ENDPOINT" \
            -m "$COS_THREAD_NUM" -p "$COS_PART_SIZE" \
            --retry "$COS_RETRY" --timeout "$COS_TIMEOUT"

      # 全部产物（安装包 + blockmap）一次性上传到统一更新目录，不含 latest*.yml
      # （latest.yml 是客户端发现更新的唯一入口，由 publish-update 闸门人工审批后上传，
      # 因此安装包提前上传无害——在 latest.yml 生效前没有任何客户端会下载它们）。
      # 逐文件上传 + 调用级重试：coscmd upload 默认开启分片断点续传（-f/--force 才是
      # 关闭断点），重试同一文件时从中断的分片继续；逐文件循环保证单文件失败不影响其他
      - name: Upload to Tencent Cloud COS
        if: steps.check-secrets.outputs.available == 'true'
        shell: bash
        run: |
          set -e
          shopt -s nullglob
          for file in artifacts/*.exe artifacts/*.dmg artifacts/*.AppImage artifacts/*.deb artifacts/*.rpm artifacts/*.blockmap; do
            [ -f "$file" ] || continue
            for attempt in 1 2 3 4 5; do
              echo "Uploading $file (attempt $attempt/5)"
              if coscmd upload -y "$file" "$COS_UPDATER_DIR"; then
                break
              fi
              if [ "$attempt" = 5 ]; then
                echo "::error::Upload failed after 5 attempts: $file"
                exit 1
              fi
              sleep $((attempt * 15))
            done
          done

  # 更新日志源文件上传：客户端检测到新版本后，会从更新目录拉取 CHANGELOG.md，
  # 按当前版本与最新版本的区间自行截取日志并以 markdown 展示，无需维护 infos.json。
  upload-changelog:
    needs: upload-cos
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5

      - name: Check COS secrets availability
        id: check-secrets
        run: |
          if [ -n "$COS_SECRET_ID" ]; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
            echo "Skipping changelog upload: TENCENT_SECRET_ID not configured"
          fi
        env:
          COS_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}

      - name: Install Tencent Cloud CLI
        if: steps.check-secrets.outputs.available == 'true'
        run: pip install coscmd

      - name: Configure Tencent Cloud COS
        if: steps.check-secrets.outputs.available == 'true'
        run: |
          coscmd config -a ${{ secrets.TENCENT_SECRET_ID }} \
            -s ${{ secrets.TENCENT_SECRET_KEY }} \
            -b "$COS_BUCKET" \
            -e "$COS_ENDPOINT" \
            -m "$COS_THREAD_NUM" -p "$COS_PART_SIZE" \
            --retry "$COS_RETRY" --timeout "$COS_TIMEOUT"

      - name: Upload CHANGELOG.md to COS
        if: steps.check-secrets.outputs.available == 'true'
        run: coscmd upload -y CHANGELOG.md "$COS_UPDATER_DIR"

  # 发布闸门（内嵌人工审批）：只上传 latest*.yml（win=latest.yml / mac=latest-mac.yml /
  # linux=latest-linux.yml）到 COS 更新目录，latest.yml 是客户端发现更新的唯一入口。
  # 绑定 publish-update environment（需仓库 Settings → Environments 配置 Required reviewers）：
  # 运行到此 job 会停在「Review deployments」，Approve 后客户端才能检测更新，Reject 则不发布；
  # 等待审批期间 job 处于 waiting 状态，不占 runner、不计算分钟数（run 寿命上限 35 天）。
  # 数据源为该 tag 的 Release 附件（upload-release 已上传），不受 CI artifacts 3 天保留期限制。
  # 补发/重发历史版本请用独立的 publish-update.yml（手动触发，可指定任意 tag）。
  publish-update:
    needs: upload-changelog
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: publish-update
    # fork 仓库无 COS 密钥时跳过不报错
    continue-on-error: true

    steps:
      - name: 下载该 tag Release 附件中的 latest*.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG_NAME=${GITHUB_REF#refs/tags/}
          mkdir -p updater-meta && cd updater-meta
          # 未 checkout 仓库，gh 无法从 git 上下文推断目标仓库，必须显式 --repo
          gh release download "$TAG_NAME" --pattern 'latest*.yml' --clobber --repo ${{ github.repository }}
          echo '已下载的更新元数据文件：'
          ls -la
          # 一个都没有说明构建附件未上传完整，直接失败
          ls latest*.yml >/dev/null

      - name: Check COS secrets availability
        id: check-secrets
        run: |
          if [ -n "$COS_SECRET_ID" ]; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
            echo "Skipping publish-update: TENCENT_SECRET_ID not configured"
          fi
        env:
          COS_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}

      - name: Install Tencent Cloud CLI
        if: steps.check-secrets.outputs.available == 'true'
        run: pip install coscmd

      - name: Configure Tencent Cloud COS
        if: steps.check-secrets.outputs.available == 'true'
        run: |
          coscmd config -a ${{ secrets.TENCENT_SECRET_ID }} \
            -s ${{ secrets.TENCENT_SECRET_KEY }} \
            -b "$COS_BUCKET" \
            -e "$COS_ENDPOINT" \
            -m "$COS_THREAD_NUM" -p "$COS_PART_SIZE" \
            --retry "$COS_RETRY" --timeout "$COS_TIMEOUT"

      # 逐文件上传 + 调用级重试（分片断点续传，重试续传不重传）
      - name: 上传 latest*.yml 到 COS 更新目录
        if: steps.check-secrets.outputs.available == 'true'
        shell: bash
        run: |
          set -e
          shopt -s nullglob
          for file in updater-meta/latest*.yml; do
            [ -f "$file" ] || continue
            for attempt in 1 2 3 4 5; do
              echo "Uploading $file (attempt $attempt/5)"
              if coscmd upload -y "$file" "$COS_UPDATER_DIR"; then
                break
              fi
              if [ "$attempt" = 5 ]; then
                echo "::error::Upload failed after 5 attempts: $file"
                exit 1
              fi
              sleep $((attempt * 15))
            done
          done

      # 审批通过即最终确认：同步把 draft Release 转为正式发布（下载链接对外可用）
      - name: 将 Release 转为正式发布
        if: steps.check-secrets.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${GITHUB_REF#refs/tags/}" --draft=false --repo ${{ github.repository }}
